:root{
  --canvas:#FCFCFD;
  --page-veil:rgba(252,252,253,.70);
  --canvas-tint:#F6F6F4;
  --surface:#FFFFFF;
  --surface-glass:rgba(255,255,255,.86);
  --surface-sink:#F3F3F0;
  --ink-1:#16161F;
  --ink-2:#2A2A38;
  --ink-3:#5A5A6E;
  --ink-4:#63637A;
  --ink-invert:#FFFFFF;
  --line:rgba(22,22,31,.08);
  --line-strong:rgba(22,22,31,.15);
  --line-soft:rgba(22,22,31,.05);
  --divider:#EAEAE5;
  --hue-green:#10B981;
  --hue-emerald:#059669;
  --hue-teal:#0D9488;
  --hue-lime:#84CC16;
  --hue-amber:#F59E0B;
  --hue-orange:#EA580C;
  --deep-1:#047857;
  --deep-2:#0F766E;
  --deep-3:#B45309;
  --deep-4:#9A3412;
  --deep-5:#166534;
  --primary:var(--deep-1);
  --primary-hover:#065F46;
  --primary-soft:rgba(4,120,87,.09);
  --primary-ring:rgba(4,120,87,.32);
  --accent:var(--deep-3);
  --accent-soft:rgba(180,83,9,.09);
  --success:#047857;
  --warning:#B45309;
  --danger:#9F1239;
  --info:#1D4ED8;
  --g1:var(--deep-1);
  --g2:var(--deep-2);
  --g3:var(--deep-3);
  --g4:var(--deep-4);
  --g5:var(--deep-5);
  --fs-display:clamp(2.4rem,1.6rem+3.2vw,3.8rem);
  --fs-h2:clamp(1.8rem,1.4rem+1.6vw,2.4rem);
  --fs-h3:clamp(1.15rem,1rem+.6vw,1.35rem);
  --fs-body:.9375rem;
  --fs-sm:.8125rem;
  --fs-xs:.75rem;
  --space-1:.5rem;
  --space-2:1rem;
  --space-3:1.5rem;
  --space-4:2rem;
  --space-5:3rem;
  --space-6:4rem;
  --space-section-md:4.5rem;
  --space-section-lg:6.5rem;
  --radius-sm:6px;
  --radius-md:10px;
  --radius-lg:14px;
  --radius-xl:20px;
  --radius-2xl:28px;
  --font-sans:"Inter","PingFang SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:"JetBrains Mono","SF Mono",Consolas,Menlo,monospace;
  --t-fast:.18s ease;
  --t-mid:.32s cubic-bezier(.2,.7,.3,1);
  --ease-breath:cubic-bezier(.42,0,.58,1);
  --grad-spectrum:linear-gradient(100deg,var(--hue-green) 0%,var(--hue-teal) 22%,var(--hue-lime) 44%,var(--hue-amber) 65%,var(--hue-orange) 84%,var(--hue-green) 100%);
  --grad-text:linear-gradient(100deg,var(--g1) 0%,var(--g2) 26%,var(--g3) 50%,var(--g4) 74%,var(--g5) 100%);
  --grad-solid:linear-gradient(100deg,var(--g1) 0%,var(--g2) 26%,var(--g3) 50%,var(--g4) 74%,var(--g5) 100%);
  --grad-pan-dur:24s;
  --grad-band-text:300% 100%;
}

*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;color-scheme:light;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:var(--font-sans);font-size:var(--fs-body);line-height:1.7;color:var(--ink-2);background:var(--canvas);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(60% 50% at 12% 8%,rgba(16,185,129,.22),transparent 60%),radial-gradient(50% 45% at 88% 12%,rgba(245,158,11,.18),transparent 60%),radial-gradient(55% 50% at 78% 90%,rgba(13,148,136,.18),transparent 65%),radial-gradient(50% 45% at 18% 85%,rgba(132,204,22,.16),transparent 65%),var(--canvas);filter:saturate(1.1);animation:aurora 28s var(--ease-breath) infinite alternate}
body::after{content:"";position:fixed;inset:0;z-index:-1;background:var(--page-veil);pointer-events:none}
@keyframes aurora{0%{background-position:0% 0%,100% 0%,100% 100%,0% 100%}50%{background-position:50% 30%,50% 0%,50% 70%,50% 100%}100%{background-position:100% 50%,0% 30%,0% 50%,100% 50%}}
a,button{touch-action:manipulation;color:var(--primary);text-decoration:none;transition:color var(--t-fast)}
a:hover{color:var(--primary-hover)}
strong{color:var(--ink-1);font-weight:700}
code{font-family:var(--font-mono);font-size:.92em;color:var(--primary)}
img,svg{max-width:100%}
h1,h2,h3,h4{color:var(--ink-1);margin:0;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h1{font-size:var(--fs-display);line-height:1.05;font-weight:800;letter-spacing:-.03em}
h2{font-size:var(--fs-h2);line-height:1.15}
h3{font-size:var(--fs-h3);line-height:1.3;font-weight:600;letter-spacing:-.01em}
p{margin:0 0 var(--space-2);text-wrap:pretty;max-width:65ch}
ul{margin:0;padding:0;list-style:none}
::selection{background:var(--primary-ring);color:var(--ink-1)}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px;border-radius:4px}
*{scrollbar-width:thin;scrollbar-color:#C9C9C0 transparent}
*::-webkit-scrollbar{width:10px;height:10px}
*::-webkit-scrollbar-thumb{background:#C9C9C0;border-radius:5px}
.container{width:100%;max-width:1240px;margin:0 auto;padding:0 1.5rem}
.skip-link{position:absolute;left:-999px;top:0;z-index:9999;background:var(--primary);color:#fff;padding:.5rem 1rem;border-radius:0 0 var(--radius-md) 0;font-weight:600}
.skip-link:focus{left:0;color:#fff}

/* =================== NAV =================== */
.nav{position:sticky;top:0;z-index:50;backdrop-filter:saturate(160%) blur(14px);-webkit-backdrop-filter:saturate(160%) blur(14px);background:rgba(252,252,253,.72);border-bottom:1px solid var(--line-soft)}
.nav__inner{display:flex;align-items:center;gap:1.5rem;height:60px}
.nav__brand{display:flex;align-items:center;gap:.5rem;font-weight:800;color:var(--ink-1);font-size:1.05rem;letter-spacing:-.01em}
.nav__links{display:flex;gap:.25rem;margin-left:1.5rem;flex:1}
.nav__link{padding:.4rem .75rem;color:var(--ink-3);font-weight:500;font-size:.875rem;border-radius:var(--radius-sm);transition:all var(--t-fast)}
.nav__link:hover{color:var(--ink-1);background:var(--surface-sink)}
.nav__link[aria-current="page"]{color:var(--ink-1);background:var(--primary-soft)}
.nav__actions{display:flex;gap:.5rem}
.nav__toggle{display:none;background:none;border:0;color:var(--ink-2);cursor:pointer;padding:.4rem;border-radius:var(--radius-sm)}
.nav__toggle:hover{background:var(--surface-sink)}
.nav__drawer{display:none}

/* =================== BTN =================== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;padding:.7rem 1.2rem;border-radius:var(--radius-md);font-weight:600;font-size:.875rem;line-height:1;border:1px solid transparent;cursor:pointer;transition:all var(--t-mid);white-space:nowrap;text-decoration:none}
.btn--sm{padding:.45rem .85rem;font-size:.8125rem}
.btn--lg{padding:.85rem 1.5rem;font-size:.9375rem}
.btn--primary{color:#fff;background:var(--grad-solid);background-size:200% 100%;background-position:0% 50%;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 8px 20px -6px rgba(4,120,87,.45)}
.btn--primary:hover{color:#fff;background-position:100% 50%;box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 12px 28px -6px rgba(4,120,87,.55);transform:translateY(-1px)}
.btn--secondary{color:var(--ink-1);background:var(--surface);border-color:var(--line-strong)}
.btn--secondary:hover{color:var(--ink-1);background:var(--surface-sink);border-color:var(--ink-4)}
.btn--light{color:var(--ink-1);background:#fff;border-color:var(--line)}
.btn--light:hover{background:var(--surface-sink);color:var(--ink-1)}

/* =================== HERO =================== */
.hero{padding-block:var(--space-section-lg) var(--space-section-md);overflow:hidden}
.hero__inner{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;gap:3rem;align-items:center}
.hero__copy{max-width:600px;min-width:0}
.tag{display:inline-flex;align-items:center;gap:.4rem;padding:.35rem .75rem;background:var(--primary-soft);color:var(--primary);border-radius:999px;font-size:var(--fs-xs);font-weight:600;margin-bottom:1.25rem;border:1px solid rgba(4,120,87,.18)}
.tag::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 0 rgba(4,120,87,.6);animation:pulse 2s var(--ease-breath) infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(4,120,87,.6)}70%{box-shadow:0 0 0 6px rgba(4,120,87,0)}100%{box-shadow:0 0 0 0 rgba(4,120,87,0)}}
.hero__title{margin-bottom:1.25rem;background-image:var(--grad-text);background-size:var(--grad-band-text) 100%;background-repeat:no-repeat;background-position:0% 50%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:grad-pan var(--grad-pan-dur) var(--ease-breath) infinite alternate}
@keyframes grad-pan{0%{background-position:0% 50%}100%{background-position:100% 50%}}
.hero__lead{color:var(--ink-3);font-size:clamp(1rem,.95rem+.25vw,1.125rem);line-height:1.7;max-width:52ch;margin-bottom:1.5rem}
.hero__principles{display:grid;gap:.85rem;margin:0 0 1.5rem;padding:0}
.hero__principles li{display:flex;align-items:flex-start;gap:.75rem;color:var(--ink-2);font-size:clamp(.9375rem,.9rem+.2vw,1.0625rem);line-height:1.6}
.hero__principles li::before{content:"";flex-shrink:0;width:6px;height:6px;margin-top:.5rem;border-radius:50%;background:var(--grad-spectrum);background-size:200% 100%}
.hero__principle-meta{margin-left:auto;flex-shrink:0;color:var(--ink-4);font-size:var(--fs-xs);font-weight:500;padding:.15rem .5rem;background:var(--surface-sink);border-radius:999px}
.hero__cta{display:flex;flex-wrap:wrap;gap:.75rem}
.hero__media{position:relative;min-width:0}

/* 鐪熷疄鎴浘绐楀彛 */
.window{background:var(--surface);border-radius:var(--radius-xl);border:1px solid var(--line-strong);box-shadow:0 30px 60px -20px rgba(22,22,31,.18),0 0 0 1px rgba(255,255,255,.6) inset;overflow:hidden}
.window__bar{display:flex;align-items:center;gap:.4rem;padding:.65rem 1rem;background:linear-gradient(180deg,#FAFAF7,#F3F3F0);border-bottom:1px solid var(--line)}
.window__dot{width:11px;height:11px;border-radius:50%}
.window__dot:nth-child(1){background:#EF4444}
.window__dot:nth-child(2){background:#F59E0B}
.window__dot:nth-child(3){background:#10B981}
.window__addr{margin-left:.75rem;font-family:var(--font-mono);font-size:.75rem;color:var(--ink-4)}
.window__body--flush{padding:0}
.window__img{width:100%;height:auto;display:block;border-radius:0 0 var(--radius-xl) var(--radius-xl);max-height:420px;object-fit:cover}

.hero__float{position:absolute;background:var(--surface-glass);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--radius-md);padding:.5rem .75rem;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:.4rem;box-shadow:0 8px 24px -8px rgba(22,22,31,.18);z-index:2}
.hero__float svg{flex-shrink:0;color:var(--success)}
.hero__float--tl{top:-1rem;left:-1.5rem;animation:float 6s var(--ease-breath) infinite}
.hero__float--tr{top:3rem;right:-1.25rem;animation:float 6s var(--ease-breath) infinite 1s}
.hero__float--br{bottom:-1rem;right:1rem;animation:float 6s var(--ease-breath) infinite 2s}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

/* =================== SECTION =================== */
.section{padding-block:var(--space-section-md)}
.section--lg{padding-block:var(--space-section-lg)}
.section--subtle{background:rgba(255,255,255,.4)}
.section__head{max-width:760px;margin:0 0 2.5rem}
.section__head--center{margin-inline:auto;text-align:center}
.section__eyebrow{display:inline-block;color:var(--primary);font-size:var(--fs-xs);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:.5rem}
.section__title{margin-bottom:.75rem}
.section__lead{color:var(--ink-3);font-size:clamp(1rem,.95rem+.2vw,1.0625rem);max-width:60ch;margin:0}
.reveal{opacity:0;transform:translateY(16px);transition:opacity .7s var(--ease-breath),transform .7s var(--ease-breath)}
.reveal.is-visible{opacity:1;transform:translateY(0)}

/* =================== STATS =================== */
.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:1rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);padding:2rem;box-shadow:0 4px 16px -8px rgba(22,22,31,.08)}
.stat{padding:0 .5rem;border-left:1px solid var(--line)}
.stat:first-child{border-left:0}
.stat__num{font-size:clamp(2rem,1.6rem+1.4vw,2.8rem);font-weight:800;color:var(--ink-1);letter-spacing:-.03em;line-height:1;margin-bottom:.4rem;font-variant-numeric:tabular-nums}
.stat--accent .stat__num{background-image:var(--grad-text);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:grad-pan var(--grad-pan-dur) var(--ease-breath) infinite alternate}
.stat__label{color:var(--ink-3);font-size:var(--fs-xs);line-height:1.5;font-weight:500}

/* =================== SOURCE WALL =================== */
.source-wall{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:center;max-width:920px;margin:0 auto}
.source-wall__item{padding:.45rem .85rem;background:var(--surface);border:1px solid var(--line);border-radius:999px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2);transition:all var(--t-fast)}
.source-wall__item:hover{border-color:var(--primary);color:var(--primary);transform:translateY(-1px);box-shadow:0 4px 12px -4px rgba(4,120,87,.25)}
.source-wall__meta{display:flex;align-items:center;gap:1rem;justify-content:center;margin-top:1.5rem;font-size:var(--fs-xs);color:var(--ink-3)}
.source-wall__meta strong{color:var(--ink-1);font-family:var(--font-mono);font-weight:700}
.source-wall__meta-divider{width:1px;height:12px;background:var(--divider)}

/* =================== BENTO GRID =================== */
.grid{display:grid;gap:1rem}
.grid--bento{grid-template-columns:repeat(3,1fr);grid-auto-rows:minmax(180px,auto)}
.grid--3{grid-template-columns:repeat(3,1fr)}
.grid--2{grid-template-columns:repeat(2,1fr)}
.card{position:relative;display:flex;flex-direction:column;padding:1.5rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);transition:all var(--t-mid);overflow:hidden;text-decoration:none;color:inherit}
.card:hover{border-color:var(--line-strong);box-shadow:0 16px 40px -16px rgba(22,22,31,.15);transform:translateY(-2px);color:inherit}
.card__num{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-4);font-weight:600;letter-spacing:.04em;margin-bottom:.5rem}
.card__icon{display:inline-flex;align-items:center;justify-content:center;width:42px;height:42px;border-radius:var(--radius-md);background:var(--primary-soft);color:var(--primary);margin-bottom:1rem}
.card__icon--accent{background:var(--accent-soft);color:var(--accent)}
.card__title{margin-bottom:.5rem;color:var(--ink-1);font-size:1.125rem}
.card__text{color:var(--ink-3);font-size:var(--fs-sm);line-height:1.6;margin-bottom:1rem;flex:1}
.card__meta{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:auto}
.card__meta span{padding:.2rem .55rem;background:var(--surface-sink);color:var(--ink-3);font-size:.7rem;font-weight:600;border-radius:6px}
.card__arrow{position:absolute;top:1.25rem;right:1.25rem;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink-4);background:var(--surface-sink);transition:all var(--t-mid)}
.card:hover .card__arrow{color:#fff;background:var(--primary);transform:rotate(-15deg) translate(2px,-2px)}
.card--wide{grid-column:span 2}
.card--half{grid-column:span 1}
.card__thumb{border-radius:var(--radius-md);border:1px solid var(--line);overflow:hidden;max-height:180px;object-fit:cover;width:100%;margin-top:.75rem}

/* =================== SHOT (鐪熷疄鎴浘) =================== */
.shot{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl);overflow:hidden;transition:all var(--t-mid)}
.shot:hover{box-shadow:0 12px 32px -12px rgba(22,22,31,.15);transform:translateY(-2px)}
.shot__bar{display:flex;align-items:center;gap:.4rem;padding:.6rem .85rem;background:linear-gradient(180deg,#FAFAF7,#F3F3F0);border-bottom:1px solid var(--line)}
.shot__bar span{width:10px;height:10px;border-radius:50%}
.shot__bar span:nth-child(1){background:#EF4444}
.shot__bar span:nth-child(2){background:#F59E0B}
.shot__bar span:nth-child(3){background:#10B981}
.shot__url{margin-left:.5rem;font-family:var(--font-mono);font-size:.7rem;color:var(--ink-4)}
.shot__img{width:100%;height:auto;display:block}
.shot__body{padding:.85rem 1rem;display:flex;justify-content:space-between;align-items:center}
.shot__title{font-size:var(--fs-sm);font-weight:600;color:var(--ink-1)}
.shot__desc{font-size:var(--fs-xs);color:var(--ink-3);margin-top:.15rem}
.shot__tag{font-family:var(--font-mono);font-size:var(--fs-xs);color:var(--ink-4);background:var(--surface-sink);padding:.15rem .5rem;border-radius:999px}

/* =================== STACK =================== */
.stack{display:grid;gap:1.25rem;padding:2rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-xl)}
.stack__group{display:grid;grid-template-columns:140px 1fr;gap:1.5rem;align-items:start}
.stack__label{font-size:var(--fs-xs);font-weight:700;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase;padding-top:.5rem}
.tags{display:flex;flex-wrap:wrap;gap:.4rem}
.chip{padding:.35rem .7rem;background:var(--surface-sink);border:1px solid var(--line);border-radius:999px;font-size:var(--fs-xs);font-weight:600;color:var(--ink-2)}
.chip:hover{color:var(--primary);border-color:var(--primary)}

/* =================== ROWS =================== */
.rows{display:grid;gap:.65rem;max-width:980px;margin:0 auto}
.row{display:grid;grid-template-columns:1fr auto 1.5fr;align-items:center;gap:1rem;padding:1rem 1.25rem;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);transition:all var(--t-mid)}
.row:hover{border-color:var(--primary)}
.row__problem{color:var(--ink-3);font-weight:500;font-size:var(--fs-sm)}
.row__problem::before{content:"鉁?;color:var(--danger);font-weight:700;margin-right:.5rem}
.row__arrow{color:var(--ink-4)}
.row__fix{color:var(--ink-1);font-size:var(--fs-sm);line-height:1.6}
.row__fix::before{content:"鉁?;color:var(--success);font-weight:700;margin-right:.5rem}

/* =================== CTA =================== */

(function(){
  // 婊氬姩鎻ず
  if('IntersectionObserver' in window){
    var io=new IntersectionObserver(function(es){
      es.forEach(function(e){
        if(e.isIntersecting){e.target.classList.add('is-visible');io.unobserve(e.target);}
      });
    },{threshold:.12,rootMargin:'0px 0px -40px 0px'});
    document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});
  }
  // 绉诲姩绔娊灞?  var btn=document.getElementById('navToggle');
  var drawer=document.getElementById('nav-drawer');
  if(btn&&drawer){
    btn.addEventListener('click',function(){
      var open=drawer.classList.toggle('is-open');
      btn.setAttribute('aria-expanded',open?'true':'false');
    });
    drawer.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click',function(){
        drawer.classList.remove('is-open');
        btn.setAttribute('aria-expanded','false');
      });
    });
  }
  // 鏃堕挓
  var c=document.getElementById('clock');
  if(c){
    (function tick(){
      var d=new Date();
      c.textContent=[d.getHours(),d.getMinutes(),d.getSeconds()].map(function(n){return String(n).padStart(2,'0');}).join(':');
      setTimeout(tick,1000);
    })();
  }
  // 骞虫粦婊氬姩
  document.querySelectorAll('a[href^="#"]').forEach(function(a){
    a.addEventListener('click',function(e){
      var id=a.getAttribute('href');
      if(id.length<2)return;
      var t=document.querySelector(id);
      if(!t)return;
      e.preventDefault();
      window.scrollTo({top:t.getBoundingClientRect().top+window.scrollY-60,behavior:'smooth'});
