server:
  port: 9090

spring:
  application:
    name: vuehouduan
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # ========== 部署时请修改为你的实际数据库配置 ==========
    url: jdbc:mysql://localhost:3306/agricultural_ecommerce?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:please_change_me}
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 5000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.vuehouduan.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  # ========== 生产环境务必通过环境变量注入至少 64 位随机字符串 ==========
  secret: ${JWT_SECRET:please_generate_a_secure_random_key_at_least_64_chars_long_xxxxxxxx}
  expiration: ${JWT_EXPIRATION:86400000}

logging:
  level:
    com.example.vuehouduan: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
